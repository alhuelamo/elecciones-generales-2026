[project]
name = "elecciones-pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Alberto Huélamo", email = "alhuelamo+code@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.4",
]

[project.scripts]
elecciones = "elecciones_pipeline.cli:main"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.2.0",
]
