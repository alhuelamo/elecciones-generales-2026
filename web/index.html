<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#FAF7F0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16151A"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var stored = localStorage.getItem("eg26.theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var isDark = stored === "dark" || (stored !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
    <title>Elecciones generales 2026</title>
    <meta
      name="description"
      content="Consulta las candidaturas al Congreso y al Senado del 29-N. Web no oficial."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elecciones generales 2026" />
    <meta
      property="og:url"
      content="https://alhuelamo.com/elecciones-generales-2026/"
    />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="ca_ES" />
    <meta property="og:title" content="Elecciones generales 2026" />

      property="og:description"
      content="Encuentra tu municipio y consulta las candidaturas."
    />

      content="https://alhuelamo.com/elecciones-generales-2026/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elecciones generales 2026" />

      name="twitter:description"
      content="Encuentra tu municipio y consulta las candidaturas."
    />
  </head>

  </body>
</html>
