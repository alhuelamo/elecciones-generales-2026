<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var stored = localStorage.getItem("eg26.theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var isDark = stored === "dark" || (stored !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
    <title>Elecciones generales 2026</title>
    <meta
      name="description"
      content="Consulta las candidaturas al Congreso y al Senado del 29-N. Web no oficial."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Elecciones generales 2026" />
    <meta
      property="og:description"
      content="Encuentra tu municipio y consulta las candidaturas."
    />
    <meta
      property="og:image"
      content="https://alhuelamo.com/elecciones-generales-2026/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
